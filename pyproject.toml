[project]
name = "artist-quran-recognizer"
version = "0.1.0"
description = "Localisation horodatée des versets du Coran dans un audio/vidéo, texte Mushaf exact et traduction officielle."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
]

[project.optional-dependencies]
# Dépendances lourdes isolées : le cœur (domain/corpus/matching/decoding) n'en a pas besoin.
audio = ["soundfile>=0.12", "numpy>=1.26"]
asr = ["torch>=2.3", "transformers>=4.44", "nemo_toolkit[asr]>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6"]

[project.scripts]
aqr = "aqr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers -m 'not slow and not acceptance'"
markers = [
  "slow: vrais modèles ASR (GPU conseillé)",
  "acceptance: audios du manifeste (AQR_AUDIO_DIR requis)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caractères arabes/français ambigus : voulus

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["aqr"]

[tool.coverage.run]
source = ["aqr"]
omit = ["src/aqr/adapters/*"]
