# File d'annotation du petit ensemble DEV — protocole : docs/ANNOTATION-DEV-SET.md
#
# CE FICHIER N'EST PAS UNE VÉRITÉ TERRAIN. Il liste des fenêtres à écouter et annoter par un
# humain. Aucune étiquette de verset n'est écrite ici : `reason` dit pourquoi la fenêtre a été
# choisie, `model_hint` (le cas échéant) rapporte une observation d'une préannotation modèle,
# « à vérifier à l'oreille », jamais à recopier.
#
# Périmètre : fichiers DEV uniquement (lot1-01, 03, 04, 05, 06, 09, 12). Le jeu test
# (lot1-02, 07, 08, 10, 11) est réservé : aucune fenêtre ne s'y trouve et rien n'en a servi
# à choisir ces fenêtres. Garde-fou : tests/unit/test_annotation_queue.py.
#
# selection_basis : pourquoi CETTE fenêtre.
#   model_preannotation   fenêtre repérée sur la sortie brute d'un modèle (trou, reprise,
#                         citation supposée) : l'indice peut être faux.
#   structure_du_fichier  fenêtre choisie sans modèle (début, milieu ou fin du fichier,
#                         plage de contrôle) : le contenu n'a pas été écouté.
# Temps en secondes dans le fichier source ; marges incluses (commencer un peu avant, finir un
# peu après). status : todo -> annotating -> annotated (l'enregistrement humain se fait
# dans le manifeste, annotation.by: human + reviewed_by).
